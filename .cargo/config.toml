[alias]
xtask = "run -p xtask --"

# Windows: link the C runtime into the exe. Without it prosecraft-rs.exe needs VCRUNTIME140.dll,
# which a fresh Windows doesn't have, and exits at once (0xC0000135) with no message.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
