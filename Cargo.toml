[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/prosecraft-rs", "apps/prosecraft-mcp", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/jonasbove/ProseCraft-rs"

[workspace.dependencies]
# internal
prosecraft-core = { path = "crates/core" }
prosecraft-ui-egui = { path = "crates/ui-egui" }
prosecraft-native = { path = "crates/native" }

# shared Craft libraries (storytold/craft-libs), pinned by commit
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-html = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-xml = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-image-codecs = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-docx = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-wordmodel = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0", default-features = false }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5", version = "=0.1.0" }

# foundation
thiserror = "2"
# Text in legacy encodings decoded as the browser's TextDecoder does (the WHATWG Encoding
# Standard; what craft-codepage uses for East Asian code pages). MIT OR Apache-2.0.
encoding_rs = "0.8"
# All date and time conversion goes through chrono (Rust house rule 5).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Sine and cosine computed as JavaScript's Math.sin/Math.cos (both from fdlibm), for the
# relation network's layout, which magnifies a difference in the last bit. MIT.
libm = "0.2"
# Encrypted backups and sync files, read and written exactly as ProseCraft does: Argon2id derives
# the key, XChaCha20-Poly1305 seals the records (RustCrypto, MIT OR Apache-2.0).
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
base64 = "0.23"
# NFKC for passphrases, as ProseCraft's `passphrase.normalize("NFKC")` ((MIT OR Apache-2.0) AND Unicode-3.0).
unicode-normalization = "0.1"
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
zeroize = "1"
# ECMAScript regular expressions, for marked's rules to match as they do in JavaScript
# (MIT OR Apache-2.0).
regress = "0.12"
# The WHATWG URL Standard, for links judged as ProseCraft's `new URL()` judges them (MIT OR
# Apache-2.0).
url = "2.5"
# SHA-256, for the hashes ProseCraft's open sync folder keeps (RustCrypto, MIT OR Apache-2.0).
sha2 = "0.11"
# The platform data folder for the library (MIT OR Apache-2.0).
dirs = "6"
tempfile = "3"
getrandom = "0.3"

# Generated covers: drawn on the CPU with the vello_cpu and skrifa that egui's epaint already
# builds (pinned to them, so there is one copy of each).
vello_cpu = { version = "=0.2.0", default-features = false, features = ["std", "u8_pipeline"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }

# Proofreading: Harper, the engine ProseCraft runs as harper.js 3.0.0.
harper-core = { version = "=3.0.0", default-features = false }

# Equations and calculations: RaTeX (KaTeX's layout, its fonts embedded) to SVG, and resvg to
# raster them for exports and the editor.
ratex-parser = { version = "=0.1.16", default-features = false }
ratex-layout = { version = "=0.1.16", default-features = false }
ratex-types = { version = "=0.1.16", default-features = false }
ratex-svg = { version = "=0.1.16", default-features = false, features = ["embed-fonts"] }
resvg = { version = "=0.50.0", default-features = false, features = ["text"] }
# Mermaid diagrams (ProseCraft's mermaid.js), drawn with its neutral theme.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }

# ui
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "web_screen_reader"] }
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# The suite's egui and winit, as craft-libs and the other Craft apps build them.
[patch.crates-io]
# craft-pdf's content-stream parser (`cos::content`, used by the PDF export test) needs the
# patched Hayro tokenizer craft-libs vendors, at the same revision as craft-pdf.
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5" }
# The split view draws PDFs with craft-pdf's raster, which needs the rest of the Hayro crates
# craft-libs vendors.
hayro = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "8672aff3d85ccad8f2a391304139d192a7d08dd5" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
