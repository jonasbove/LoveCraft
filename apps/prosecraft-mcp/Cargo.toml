[package]
name = "prosecraft-mcp"
description = "LoveCraft MCP server: a ProseCraft open sync folder over stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The command is `lovecraft-mcp`; the package keeps its first name (`cargo run -p prosecraft-mcp`).
# The packages also install `prosecraft-mcp`, the 0.1 command, as an alias of it.
[[bin]]
name = "lovecraft-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
prosecraft-core = { workspace = true }
craft-mcp-server = { workspace = true }
craft-atomic = { workspace = true }
# The JSON-RPC values craft-mcp-server takes and returns (MIT OR Apache-2.0).
serde_json = "1"
# ECMAScript regular expressions, for the Markdown the search strips as JavaScript does.
regress = { workspace = true }
sha2 = { workspace = true }
# The clock for revisions and snapshots.
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
tempfile = { workspace = true }
