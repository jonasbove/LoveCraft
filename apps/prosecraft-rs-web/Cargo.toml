[package]
name = "prosecraft-rs-web"
description = "LoveCraft in the browser (built with Trunk)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# CraftCloud and other Craft hosts: the shared host messages (`?host=parent`). Its contract
# builds everywhere, so the hosted session's logic is tested natively.
[dependencies]
craft-web-host = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
prosecraft-core = { workspace = true }
prosecraft-ui-egui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "ClipboardEvent",
    "Crypto",
    "DataTransfer",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Navigator",
    "Storage",
    "Url",
    "Window",
] }

# The hosted session (src/hosted.rs) is plain Rust: its tests drive the app natively.
[dev-dependencies]
prosecraft-core = { workspace = true }
prosecraft-ui-egui = { workspace = true }
egui = { workspace = true }
egui_kittest = { workspace = true }
