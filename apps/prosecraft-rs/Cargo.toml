[package]
name = "prosecraft-rs"
description = "LoveCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The command is `lovecraft`; the package keeps its first name (`cargo run -p prosecraft-rs`).
# The packages also install `prosecraft-rs`, the 0.1 command, as an alias of it.
[[bin]]
name = "lovecraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
prosecraft-core = { workspace = true }
prosecraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["wayland", "x11"] }
prosecraft-native = { workspace = true }
craft-dialogs = { workspace = true }
craft-atomic = { workspace = true }
# The installed fonts for the writing font pickers, listed as ProseCraft's desktop app lists them.
fontdb = "0.24"
# Rich paste: the clipboard's HTML, which egui's paste leaves out (as egui-winit builds it).
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# The clock for the library's save times (desktop only).
chrono = { workspace = true, features = ["clock"] }
