[package]
name = "prosecraft-core"
description = "prosecraft-rs core: the project model, storage formats and editing logic, with no UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft-html = { workspace = true }
craft-image-codecs = { workspace = true }
craft-zip = { workspace = true }
craft-xml = { workspace = true }
# Names sorted as `localeCompare` sorts them (ICU collation, numbers by value).
craft-i18n = { workspace = true, features = ["collate"] }
encoding_rs = { workspace = true }
regress = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }
# Formatting dates (no clock: callers pass the time).
chrono = { workspace = true }

# The operating system's random numbers on the desktop. The web build supplies the browser's
# `crypto.getRandomValues` through `RandomSource` instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
