[package]
name = "prosecraft-core"
description = "prosecraft-rs core: the project model, storage formats and editing logic, with no UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft-html = { workspace = true }
craft-image-codecs = { workspace = true }
# DOCX export: the document built on the word-processing model and written as OOXML.
craft-docx = { workspace = true }
craft-wordmodel = { workspace = true }
craft-pdf = { workspace = true, features = ["cos"] }
craft-zip = { workspace = true }
craft-xml = { workspace = true }
# Names sorted as `localeCompare` sorts them (ICU collation, numbers by value).
craft-i18n = { workspace = true, features = ["collate"] }
encoding_rs = { workspace = true }
regress = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }
# Formatting dates (no clock: callers pass the time).
chrono = { workspace = true }
# Spelling and grammar (ProseCraft's proofreading).
harper-core = { workspace = true }
# Equations and calculations drawn (ProseCraft's MathJax).
ratex-parser = { workspace = true }
ratex-layout = { workspace = true }
ratex-types = { workspace = true }
ratex-svg = { workspace = true }
resvg = { workspace = true }
mermaid-rs-renderer = { workspace = true }

# The operating system's random numbers on the desktop. The web build supplies the browser's
# `crypto.getRandomValues` through `RandomSource` instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
# The DOCX fixture test prints the formatting craft-docx reads back as compact JSON (only the
# properties a file sets), so a difference anywhere in it shows. MIT OR Apache-2.0.
serde_json = "1"
craft-pdf = { workspace = true, features = ["cos", "content"] }
