[package]
name = "prosecraft-ui-egui"
description = "prosecraft-rs user interface in egui, shared by the desktop and web apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
prosecraft-core = { workspace = true }
egui = { workspace = true }
craft-ui = { workspace = true }
craft-fonts-build = { workspace = true }
chrono = { workspace = true }

# Installed system fonts as fallbacks (emoji, every script) on the desktop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-ui = { workspace = true, features = ["system_fonts"] }

[build-dependencies]
craft-fonts-build = { workspace = true }

[dev-dependencies]
# `wgpu` and `snapshot`: render the app offscreen to look at it (never a screen capture).
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
base64 = { workspace = true }
