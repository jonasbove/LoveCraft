# Flatpak manifest for the single-file bundle attached to every GitHub release
# (lovecraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (lovecraft-<version>-linux-<arch>.tar.gz, built
# by package.sh) instead of compiling Rust inside flatpak-builder: no network and no vendored crate
# sources during the build, and byte for byte the same binaries as the AppImage, deb and rpm. The
# script unpacks the tarball into `stage/` next to a copy of this file. The binary needs the build
# host's glibc and loads X11, Wayland, xkbcommon and EGL/GL at runtime; the freedesktop runtime
# has all of them, and the GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# Adapted from CraftCloud's bundle manifest, whose structure comes from craft-launcher's
# (MIT OR Apache-2.0; see NOTICE).
#
# The id keeps the app's former name (ProseCraft-rs, until 0.2.0), so installing this bundle
# updates a 0.1 one. The 0.1 commands, prosecraft-rs and prosecraft-mcp, stay as links
# (`flatpak run --command=prosecraft-mcp …` in an MCP client's configuration keeps working).
id: io.github.jonasbove.prosecraft_rs
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: lovecraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for egui's OpenGL renderer (glow).
  - --device=dri
  # Zotero's local server (127.0.0.1:23119) for citations, and web links in the wiki.
  - --share=network
  # Backups, exports, wiki files and sync folders are wherever the person keeps them: the file
  # dialogs go through the portal, but a sync folder and a wiki files folder are opened again by
  # path on the next start, which the portal's one-time grant doesn't cover.
  - --filesystem=home
  # The host's installed fonts (for the writing font pickers) are under /run/host/fonts and
  # /run/host/user-fonts in every sandbox; nothing to add.
modules:
  - name: lovecraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/lovecraft /app/bin/lovecraft
      - install -Dm755 bin/lovecraft-mcp /app/bin/lovecraft-mcp
      - ln -s lovecraft /app/bin/prosecraft-rs
      - ln -s lovecraft-mcp /app/bin/prosecraft-mcp
      - install -Dm644 share/applications/io.github.jonasbove.prosecraft_rs.desktop /app/share/applications/io.github.jonasbove.prosecraft_rs.desktop
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.jonasbove.prosecraft_rs.metainfo.xml /app/share/metainfo/io.github.jonasbove.prosecraft_rs.metainfo.xml
      # Exported to the host under the app id's name, so file managers know .prosecraft files.
      - install -Dm644 share/mime/packages/io.github.jonasbove.prosecraft_rs.xml /app/share/mime/packages/io.github.jonasbove.prosecraft_rs.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/lovecraft /app/share/doc/
    sources:
      - type: dir
        path: stage
